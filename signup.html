<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - CALTIVATOR STYLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">CALTIVATOR STYLE</a>
    <nav class="main-nav">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#collection">Collection</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="login.html" class="btn-text">Login</a>
    </div>
  </div>
</header>

<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow center">Join CALTIVATOR STYLE</p>
    <h2 class="section-title center">Create Your Account</h2>

    <form id="signupForm" class="auth-form" novalidate>
      <label>
        Full Name
        <input type="text" id="fullName" placeholder="Enter your full name" required minlength="2">
      </label>
      <label>
        Email Address
        <input type="email" id="email" placeholder="you@example.com" required>
      </label>
      <label>
        Phone Number
        <input type="tel" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
      </label>
      <label>
        Password
        <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
      </label>
      <label>
        Confirm Password
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
      </label>

      <p class="field-error" id="signupError"></p>

      <button type="submit" class="btn-primary full">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>&copy; 2026 CALTIVATOR STYLE.</span>
  </div>
</footer>

<script type="module" src="auth.js"></script>
</body>
</html>
